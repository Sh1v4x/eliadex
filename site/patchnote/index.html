<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patchnote — Eliadex (companion Wakfu)</title>
  <meta name="description" content="Toutes les nouveautés et corrections d'Eliadex, le companion Wakfu : à jour à chaque version, en direct." />
  <link rel="canonical" href="https://sh1v4x.github.io/eliadex/patchnote/" />
  <link rel="icon" type="image/png" href="../logo.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Eliadex" />
  <meta property="og:title" content="Patchnote — Eliadex" />
  <meta property="og:description" content="Nouveautés et corrections d'Eliadex, à chaque version." />
  <meta property="og:url" content="https://sh1v4x.github.io/eliadex/patchnote/" />
  <meta property="og:image" content="https://sh1v4x.github.io/eliadex/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="../config.js"></script>
  <style>
    :root{
      --teal:#7fe8e0; --gold:#f5d98a; --gold2:#d4a437;
      --ink:#dce9ee; --muted:#a9c1c9; --muted2:#8fabb4; --faint:#6d8790;
      --title:#fbf3e0; --bd:rgba(122,232,224,.14);
    }
    *{box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{margin:0; font-family:'Outfit',system-ui,sans-serif; color:var(--ink);
      background:radial-gradient(1400px 900px at 50% -10%, #0f2f3d 0%, #0a1f2a 45%, #061219 100%);
      min-height:100vh; overflow-x:hidden;}
    a{color:var(--teal); text-decoration:none;} a:hover{color:var(--gold);}
    h1,h2,h3{font-family:'Cinzel',serif; color:var(--title); margin:0;}
    ::selection{background:rgba(122,232,224,.3); color:#eafcfa;}
    ::-webkit-scrollbar{width:12px;} ::-webkit-scrollbar-track{background:#061219;}
    ::-webkit-scrollbar-thumb{background:#1c4150; border-radius:20px; border:3px solid #061219;}
    .wrap{max-width:820px; margin:0 auto; padding:0 24px;}
    .starfield{position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
      background-image:radial-gradient(1px 1px at 20% 30%, rgba(180,245,239,.7) 50%, transparent),
        radial-gradient(1px 1px at 70% 20%, rgba(245,217,138,.6) 50%, transparent),
        radial-gradient(1.5px 1.5px at 40% 70%, rgba(180,245,239,.5) 50%, transparent),
        radial-gradient(1px 1px at 85% 60%, rgba(180,245,239,.6) 50%, transparent),
        radial-gradient(1px 1px at 15% 80%, rgba(245,217,138,.5) 50%, transparent),
        radial-gradient(1.5px 1.5px at 60% 45%, rgba(180,245,239,.45) 50%, transparent);}
    nav{position:sticky; top:0; z-index:40; backdrop-filter:blur(14px);
      background:rgba(7,20,27,.72); border-bottom:1px solid rgba(122,232,224,.12);}
    nav .wrap{max-width:1180px; display:flex; align-items:center; gap:14px; padding-top:14px; padding-bottom:14px;}
    .logo{width:34px; height:34px; border-radius:9px; filter:drop-shadow(0 0 8px rgba(122,232,224,.4));}
    .brand{font-family:'Cinzel',serif; font-weight:800; font-size:19px; letter-spacing:2px; color:var(--gold);}
    .content{position:relative; z-index:2; padding:52px 0 90px;}
    .eyebrow{font-size:13px; letter-spacing:3px; text-transform:uppercase; color:var(--teal); font-weight:600;}
    h1{font-size:40px; line-height:1.05; margin:10px 0 8px;}
    .lead{color:var(--muted); font-size:15px; margin:0 0 34px;}
    .card{background:linear-gradient(180deg, rgba(19,52,64,.7), rgba(10,31,42,.7));
      border:1px solid var(--bd); border-radius:18px;}
    .pn-card{padding:22px 24px; margin-bottom:18px;}
    .pn-head{display:flex; align-items:center; gap:12px; margin-bottom:6px; flex-wrap:wrap;}
    .pn-ver{font-family:'Cinzel',serif; font-weight:800; font-size:22px; color:var(--gold);}
    .pn-date{font-size:13px; color:var(--faint);}
    .pn-latest{font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
      color:#0a1f2a; background:linear-gradient(135deg,var(--gold),var(--gold2)); padding:3px 9px; border-radius:999px;}
    .pn-sub{font-family:'Outfit',sans-serif; font-size:12.5px; font-weight:700; letter-spacing:.4px;
      text-transform:uppercase; color:var(--teal); margin:16px 0 8px;}
    .pn-list{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:8px;}
    .pn-list li{position:relative; padding-left:18px; color:var(--muted); font-size:14.5px; line-height:1.5;}
    .pn-list li::before{content:""; position:absolute; left:2px; top:9px; width:5px; height:5px;
      border-radius:50%; background:var(--teal); opacity:.6;}
    .pn-list strong{color:var(--ink); font-weight:600;}
    .pn-body p{color:var(--muted); font-size:14.5px;}
    .back{display:inline-flex; align-items:center; gap:7px; font-size:14px; color:var(--muted2); margin-bottom:26px;}
    .back:hover{color:var(--gold);}
    .muted{color:var(--muted2);}
    @media(max-width:640px){ h1{font-size:30px;} }
  </style>
</head>
<body>
  <div class="starfield"></div>

  <nav>
    <div class="wrap">
      <a href="../" style="display:flex; align-items:center; gap:12px;">
        <img src="../logo.png" alt="" class="logo" />
        <span class="brand">ELIADEX</span>
      </a>
      <div style="flex:1;"></div>
      <a href="../" style="color:#b7ccd4; font-size:14.5px; font-weight:500;">Accueil</a>
    </div>
  </nav>

  <div class="content">
    <div class="wrap">
      <a href="../" class="back">← Retour à l'accueil</a>
      <div class="eyebrow">Journal des versions</div>
      <h1>Patchnote</h1>
      <p class="lead">Toutes les nouveautés et corrections d'Eliadex, mises à jour <strong>en direct</strong> à chaque version.</p>
      <div id="pn-list"><p class="muted">Chargement du patchnote…</p></div>
    </div>
  </div>

  <script>
    (function () {
      var c = window.ELIADEX || { owner: "Sh1v4x", repo: "eliadex" };
      var el = document.getElementById("pn-list");

      function esc(s) { return String(s).replace(/[&<>]/g, function (x) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[x]; }); }
      function bold(s) { return s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }
      function md(body) {
        var out = "", inList = false;
        var close = function () { if (inList) { out += "</ul>"; inList = false; } };
        body.split(/\r?\n/).forEach(function (raw) {
          var line = raw.trim();
          if (!line) { close(); return; }
          var m;
          if ((m = line.match(/^#{1,6}\s+(.*)$/))) { close(); out += '<div class="pn-sub">' + bold(esc(m[1])) + "</div>"; }
          else if ((m = line.match(/^[-*]\s+(.*)$/))) { if (!inList) { out += '<ul class="pn-list">'; inList = true; } out += "<li>" + bold(esc(m[1])) + "</li>"; }
          else { close(); out += "<p>" + bold(esc(line)) + "</p>"; }
        });
        close();
        return out;
      }
      function frDate(iso) {
        try { return new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "long", year: "numeric" }).format(new Date(iso)); }
        catch (e) { return ""; }
      }

      // Source : data.json statique généré au déploiement (depuis les releases,
      // dont le corps vient du CHANGELOG). Local → pas de rate-limit API.
      fetch("data.json", { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (list) {
          if (!Array.isArray(list) || !list.length) {
            el.innerHTML = '<p class="muted">Patchnote indisponible pour le moment.</p>';
            return;
          }
          el.innerHTML = list.map(function (r, i) {
            return '<article class="card pn-card">'
              + '<div class="pn-head">'
              + '<span class="pn-ver">' + esc(r.tag) + "</span>"
              + '<span class="pn-date">' + frDate(r.date) + "</span>"
              + (i === 0 ? '<span class="pn-latest">Dernière</span>' : "")
              + "</div>"
              + '<div class="pn-body">' + (r.body ? md(r.body) : '<p class="muted">—</p>') + "</div>"
              + "</article>";
          }).join("");
        }).catch(function () {
          el.innerHTML = '<p class="muted">Patchnote indisponible pour le moment.</p>';
        });
    })();
  </script>
</body>
</html>
