# Déploiement du site vitrine (dossier site/) sur GitHub Pages.
# À placer dans le dépôt PUBLIC. Active Pages : Settings > Pages > Source = GitHub Actions.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  # Re-déploie (donc régénère le patchnote statique) quand une release change.
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Patchnote statique : on fige les releases (dont le corps vient du
      # CHANGELOG) dans site/patchnote/data.json. La page /patchnote/ lit ce
      # fichier local → aucun appel à l'API GitHub depuis le navigateur (donc
      # plus de rate-limit 60/h par IP). Regénéré à chaque déploiement.
      - name: Génère le patchnote statique (data.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site/patchnote
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[] | select(.draft==false and .prerelease==false)
                   | {tag: .tag_name, date: .published_at, body: .body,
                      assets: [.assets[] | {name: .name, url: .browser_download_url, dc: .download_count}]}]' \
            > site/patchnote/data.json || echo '[]' > site/patchnote/data.json
          echo "data.json : $(wc -c < site/patchnote/data.json) octets, $(grep -o '\"tag\"' site/patchnote/data.json | wc -l) versions"
          # Compteur d'installations = somme des download_count des installeurs
          # (.exe / .msi / .dmg), même périmètre que le compteur du site. Exposé
          # dans stats.json pour un badge dynamique dans le README.
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '{installs: ([.[].assets[] | select(.name|test("(?i)(-setup\\.exe|\\.msi|\\.dmg)$")) | .download_count] | add // 0)}' \
            > site/patchnote/stats.json || echo '{"installs":0}' > site/patchnote/stats.json
          echo "stats.json : $(cat site/patchnote/stats.json)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
