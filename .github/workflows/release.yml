# Build multi-OS d'Eliadex + publication de la Release — tourne dans le dépôt
# PUBLIC (minutes GitHub Actions illimitées et gratuites pour un dépôt public).
#
# Le code source vit dans le dépôt PRIVÉ `eliadex-source` : ce workflow le
# checkout via le secret SOURCE_TOKEN (PAT avec Contents: Read sur le privé),
# build macOS + Windows, puis publie la Release ICI via le GITHUB_TOKEN intégré.
# Enfin, le job `announce` poste le patchnote sur Discord — seulement si les
# DEUX builds ont réussi.
#
# Prérequis (Settings > Secrets du dépôt public) :
#   SOURCE_TOKEN         = PAT (fine-grained: Contents Read sur Sh1v4x/eliadex-source).
#   DISCORD_WEBHOOK_URL  = URL du webhook du salon d'annonces.
#                          Facultatif : sans lui, l'annonce est simplement sautée.
#
# Déclenchement : onglet Actions > "Build & Release" > Run workflow (choisis le
# tag, ex. v0.1.0). Ou pousse un tag v*.*.* sur CE dépôt.
name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de version de la release (ex. v0.1.0)"
        required: true
      ref:
        description: "Ref source à builder (branche ou tag du dépôt privé)"
        required: false
        default: main
      announce:
        description: "Poster le patchnote sur Discord à la fin"
        type: boolean
        required: false
        default: true
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  SOURCE_REPO: Sh1v4x/eliadex-source

jobs:
  build:
    strategy:
      fail-fast: false
      # Sérialisé : les jobs publient tour à tour dans la même release et
      # fusionnent latest.json (sinon course → une plateforme écrase l'autre).
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - os: windows-latest
            args: ""
            rust_target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout de la source privée
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ github.event.inputs.ref || 'main' }}
          token: ${{ secrets.SOURCE_TOKEN }}

      # Version ÉPINGLÉE. Sur bun 1.4.0, la première commande de la chaîne `&&`
      # d'un script package.json ne s'exécute pas sur le runner Windows : aucune
      # sortie, code de retour 0. C'est ainsi que le téléchargement des données
      # a été sauté en silence à partir du 24 août, livrant un installeur
      # Windows avec une base de jeu vide (issues #19 à #22). La 1.3.14 est la
      # dernière version où la chaîne s'exécute entièrement, et c'est aussi la
      # série qui a écrit `bun.lock`. À revoir quand bun aura corrigé.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # L'APP N'EMBARQUE PLUS DE BASE DE JEU. Elle lisait son catalogue dans un
      # SQLite livré avec l'installeur, et ce pas vérifiait qu'il n'était pas
      # vide (issues #19 à #22). Tout vient désormais de l'API, et le catalogue
      # est semé côté serveur : il n'y a plus rien à vérifier ici.
      #
      # CE QUI LE REMPLACE EST LE MÊME GENRE DE GARDE-FOU, pour le même genre de
      # panne. `NEXT_PUBLIC_ELIADEX_API` est INLINÉE dans le bundle au build
      # (export statique) : oubliée, elle retombe sur `http://localhost:28787`,
      # et comme l'app exige désormais un compte, l'installeur livré ne s'ouvre
      # chez PERSONNE. Une release entière à refaire, pour une variable absente.
      - name: Vérifier l'URL de l'API
        shell: bash
        env:
          API_URL: ${{ vars.ELIADEX_API_URL || 'https://api.eliadex.com' }}
        run: |
          echo "URL compilée dans l'installeur : $API_URL"
          case "$API_URL" in
            https://*) ;;
            *) echo "::error::L'URL de l'API doit être en https, pas « $API_URL »."; exit 1 ;;
          esac
          case "$API_URL" in
            *localhost*|*127.0.0.1*)
              echo "::error::L'URL de l'API pointe sur la machine de build."; exit 1 ;;
          esac
          code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$API_URL/ping" || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::$API_URL/ping a répondu $code — on ne livre pas un installeur qui vise une API muette."
            exit 1
          fi
          echo "API joignable."

      # UNE SEULE INSTALLATION, À LA RACINE : le dépôt est un monorepo Bun et
      # les paquets se lient entre eux. Un `bun install` dans `apps/app` ne
      # résoudrait ni `@eliadex/core` ni `@eliadex/ui`.
      - name: Dépendances du monorepo
        run: bun install

      # Description de la release : extraite du CHANGELOG.md (section du tag
      # publié). Si aucune section ne correspond, le corps reste vide et le
      # build continue quand même.
      - name: Notes de release (extrait du CHANGELOG)
        id: changelog
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          {
            echo "body<<__ELIADEX_EOF__"
            awk -v ver="$VER" '
              $0 ~ "^## \\["ver"\\]" { flag=1; next }
              /^## \[/ && flag { exit }
              flag { print }
            ' CHANGELOG.md
            echo "__ELIADEX_EOF__"
          } >> "$GITHUB_OUTPUT"

      # Build Tauri + publication de la Release dans CE dépôt public : installeur
      # Windows (.exe NSIS) + macOS (.dmg) + artefacts updater signés (.sig) +
      # latest.json. Avec un tagName, tauri-action crée/maj la release via
      # GITHUB_TOKEN et fusionne latest.json entre les deux plateformes.
      - name: Build & publication de la Release
        uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Lue par `packages/core/src/api/client.ts` au moment du build de
          # Next, et gravée dans le bundle : elle ne se change plus après.
          NEXT_PUBLIC_ELIADEX_API: ${{ vars.ELIADEX_API_URL || 'https://api.eliadex.com' }}
        with:
          projectPath: apps/app
          args: ${{ matrix.args }}
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Eliadex ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false

  # ---------------------------------------------------------------------------
  # SITE VITRINE
  # ---------------------------------------------------------------------------
  # Le patchnote du site est un `data.json` FIGÉ au déploiement : sans un
  # redéploiement, une nouvelle release n'y apparaît jamais.
  #
  # On déclenche pages.yml sur `main` plutôt que d'écouter l'événement `release`
  # dans pages.yml : un run déclenché par une release s'exécute sur la référence
  # du TAG, que l'environnement github-pages refuse (protégé sur `main`), et qui
  # publierait de toute façon le site tel qu'il était au moment du tag — donc
  # sans les correctifs apportés au site depuis.
  #
  # Indépendant de l'annonce Discord : couper l'une ne doit pas couper l'autre.
  site:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Redéploie le site vitrine (patchnote statique)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo ${{ github.repository }} --ref main

  # ---------------------------------------------------------------------------
  # ANNONCE DISCORD
  # ---------------------------------------------------------------------------
  # `needs: build` attend TOUTE la matrice. C'est le seul moment où les deux
  # installeurs existent : `tauri-action` crée la release dès le premier job
  # (macOS), donc un déclencheur `release: published` partirait pendant que le
  # build Windows tourne encore, et annoncerait une version à moitié publiée.
  #
  # `if: success()` : avec fail-fast:false, un job en échec laisse la matrice
  # continuer, mais `needs.build.result` vaut alors 'failure' → pas d'annonce.
  announce:
    needs: build
    if: success() && (github.event_name == 'push' || github.event.inputs.announce != 'false')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la source privée
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ github.event.inputs.ref || 'main' }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Sauter proprement plutôt qu'échouer : un build réussi ne doit pas être
      # marqué en rouge parce que le secret Discord n'est pas configuré.
      - name: Webhook configuré ?
        id: check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL absent — annonce sautée."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # --expect-version : refuse d'annoncer si LAST_PATCHNOTE.md ne correspond
      # pas au tag publié. Cas réel : un re-run du build sur un ancien tag, alors
      # que `main` porte déjà le patchnote d'une version plus récente.
      - name: Annonce du patchnote sur Discord
        if: steps.check.outputs.ok == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node tools/scripts/discord/post-patchnote.mjs \
            --expect-version "$TAG" \
            --release-url "https://github.com/${{ github.repository }}/releases/tag/$TAG"
